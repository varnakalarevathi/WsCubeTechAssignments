<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Assignment_16-Wave Animation</title>
 <style>
    *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;

}
body{
    display: flex;
    justify-content: center;
    margin-top: 20px;

}
button{
   border: none;
   outline: none;
   background: brown;
   color: white;
   border-radius: 40px;
   padding: 5px 5px;
   font-size: 7px;
   font-weight: bold;
   animation-name: wave;
   animation-duration: 3s;
   animation-iteration-count: infinite;
}
@keyframes wave {
from{transform: scale(1);
}
to{transform: scale(1.5);
   box-shadow: 0px 0px 8px  rgb(97, 8, 2);
}

}
 </style>
</head>
<body>
    <button>Enquire Now</button>
    
</body>
</html>
