<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Assignment_16-Bar Animation</title>
<style>
        *{
    margin: 0px;
    padding: 0px;
    box-sizing: border-box;
    background: #070721;
}
.barcontainer{
    width: 500px;
    height: 500px;
    margin: auto;
    margin-top: 120px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 60px;


}
.bar1{
    width: 12px;
    height: 180px;
    background: orange;
    animation: grow 4s 1.5s infinite linear;
}
.bar2{
    width: 12px;
    height: 180px;
    background: lightblue;
    animation: grow 2s 0.75s infinite linear;
}
.bar3{
    width: 12px;
    height: 180px;
    background: yellow;
    animation: grow 3s 0.25s infinite linear;
}
.bar4{
    width: 12px;
    height: 180px;
    background:  green;
    animation: grow 3.5s 1s infinite linear;
}
@keyframes grow{
    0%{ height: 180px;}
    33%{ height: 260px;}
    66%{ height: -70px;}
    100%{height: 180px;}
}

    </style>

</head>
<body>
    <div class="barcontainer">
        <div class="bar1"></div>
        <div class="bar2"></div>
        <div class="bar3"></div>
        <div class="bar4"></div>
    </div>
    
</body>
</html>
