<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Assignment_16-Bubble Animation</title>
 <style>
  *{
    margin: 0px;
    padding: 0px;
    font-family: sans-serif;
}
body{
  background-color: hsl(207, 81%, 42%);
}

.bubble1{
    width: 120px;
    height: 120px;
    border-radius: 50%;
    box-shadow: inset 0px 0px 10px 3px lightblue;
    position: fixed;
    top: 100%;
    left: 8%;
    animation: bubbleanimation 5s 0s infinite linear;

}
@keyframes bubbleanimation{
    0%{
        bottom: -200px;
    }
    100%{
        top: 0px;
    }
}
.bubble2{
    width: 60px;
    height: 60px;
    border-radius: 50%;
    box-shadow: inset 0px 0px 10px 3px lightblue;
    position: fixed;
    top: 100%;
    left: 17%;
    animation: bubbleanimation 3s 0s infinite linear;

}
.bubble3{
    width: 100px;
    height: 100px;
    border-radius: 50%;
    box-shadow: inset 0px 0px 10px 3px lightblue;
    position: fixed;
    top: 100%;
    left: 25%;
    animation: bubbleanimation 6s 0s infinite linear;

}
.bubble4{
    width: 160px;
    height: 160px;
    border-radius: 50%;
    box-shadow: inset 0px 0px 10px 3px lightblue;
    position: fixed;
    top: 100%;
    left: 40%;
    animation: bubbleanimation 10s 0s infinite linear;

}
.bubble5{
    width: 130px;
    height: 130px;
    border-radius: 50%;
    box-shadow: inset 0px 0px 10px 3px lightblue;
    position: fixed;
    top: 100%;
    left: 60%;
    animation: bubbleanimation 6.5s 0s infinite linear;

}
    .bubble6{
        width: 50px;
        height: 50px;
        border-radius: 50%;
        box-shadow: inset 0px 0px 10px 3px lightblue;
        position: fixed;
        top: 100%;
        left: 78%;
        animation: bubbleanimation 2s 0s infinite linear;
    
    }
 </style>
 
</head>
<body>
    <div class="bubble1"></div>
    <div class="bubble2"></div>
    <div class="bubble3"></div>
    <div class="bubble4"></div>
    <div class="bubble5"></div>
    <div class="bubble6"></div>
</body>
</html>
