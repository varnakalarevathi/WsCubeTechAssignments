<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Assignment_15_Image Hover Sliding Demo</title>
 <style>
  * {
   margin: 0px;
   padding: 0px;
   font-family: sans-serif;
   text-decoration: none;
   list-style: none;
   box-sizing: border-box;
  }

  body {
   background: #ffffff;
  }

  .innerbox {
   width: 300px;
   height: 300px;
   border: 2px solid red;
   display: flex;
   margin: auto;
   overflow: hidden;
   position: relative;
  }

  .innerbox1 {
   width: 100%;
   height: 100%;
   position: absolute;
   top: 0px;
   left: -600px;
   transition: 1s;
  }

  .innerbox2 {
   width: 100%;
   height: 100%;
   position: absolute;
   top: 0px;
   left: -325px;
   transition: 1s;
  }

  .innerbox3 {
   width: 100%;
   height: 100%;
   position: absolute;
   top: 0px;
   left: 0px;
   transition: 1s;
  }

  .innerbox:hover .innerbox1 {
   left: 0px;
  }

  .innerbox:hover .innerbox2 {
   left: 300px;
  }

  .innerbox:hover .innerbox3 {
   left: 600px;
  }
 </style>
</head>

<body>
 <div class="innerbox">
  <img class="innerbox1" src="images/1.jpg" alt="">
  <img class="innerbox2" src="images/2.jpg" alt="">
  <img class="innerbox3" src="images/3.jpg" alt="">
 </div>
</body>

</html>
