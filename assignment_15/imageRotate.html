<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Assignment_15_Image Rotate</title>
 <style>
  * {
   margin: 0px;
   padding: 0px;
   font-family: sans-serif;
   text-decoration: none;
   list-style: none;
   box-sizing: border-box;
  }
  .main{
   width: 300px;
   height: 300px;
   border: 1px solid red;
   display: flex;
   margin: auto;
   position: relative;
  }
   .img1{
    width: 300px;
    height: 300px;
    border-radius: 50%;
    transition: 2s;
   }
   .img2{
    width: 200px;
    height: 200px;
     border-radius: 50%;
     transition: 2s;
     position: absolute;
     top: 50px;
     left: 50px;

   }
   .img3{
     width: 100px;
    height: 100px;
    border-radius: 50%;
    transition: 2s;
    position: absolute;
     top: 100px;
     left: 100px;
   }

   .main:hover .img2{
     transform: rotate(-360deg);
    } 
     .main:hover .img1 {
      transform: rotateX(360deg);
   } 
    .main:hover .img3{
     transform: rotateX(360deg);
    }
 </style>
</head>

<body>
 <div class="main">
  <img class="img1" src="images/1.jpg" alt="">
  <img class="img2" src="images/2.jpg" alt="">
  <img class="img3" src="images/3.jpg" alt="">
 </div>
</body>

</html>
